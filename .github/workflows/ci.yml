name: ci
on: [push, pull_request]
jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - name: Install zlib (Windows)
        if: runner.os == 'Windows'
        run: vcpkg install zlib:x64-windows
      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake
          else
            cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
          fi
      - name: Build core + gp-sim
        run: cmake --build build --config RelWithDebInfo -j 4
      - name: Core unit tests
        run: ctest --test-dir build -C RelWithDebInfo --output-on-failure
      - name: Build FTC runtime (SDK 12.0.0, checksum-verified from Maven Central)
        run: java runtime/tools/Build.java
      - name: End-to-end integration (import, Java runtime match, exact replay, counterfactual)
        if: runner.os != 'Windows'   # Windows child-process path is implemented but not yet validated
        run: python3 tests/integration_test.py
