[/Script/EngineSettings.GameMapsSettings]
GameDefaultMap=/Engine/Maps/Entry
GlobalDefaultGameMode=/Script/GamePlan.GamePlanGameMode

[/Script/Engine.Engine]
; The simulation core runs on its own fixed timestep; rendering frame rate never changes physics.
bUseFixedFrameRate=False
bSmoothFrameRate=True

[/Script/Engine.InputSettings]
DefaultPlayerInputClass=/Script/EnhancedInput.EnhancedPlayerInput
DefaultInputComponentClass=/Script/EnhancedInput.EnhancedInputComponent

[/Script/Engine.RendererSettings]
; Photoreal path: Lumen global illumination + reflections, virtual shadow maps, Nanite for the
; full-resolution official field CAD (no decimation needed), temporal super resolution, hardware
; ray tracing where available, and the path tracer for reference renders / replays.
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Shadow.Virtual.Enable=1
r.Nanite.ProjectEnabled=True
r.AntiAliasingMethod=4
r.GenerateMeshDistanceFields=True
r.Lumen.HardwareRayTracing=True
r.RayTracing=True
r.PathTracing=True
r.DefaultFeature.AutoExposure=True
r.DefaultFeature.MotionBlur=False
r.SkinCache.CompileShaders=True
