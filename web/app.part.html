<script type="module">

const $ = (id) => document.getElementById(id);
const season = JSON.parse($("seasonJson").textContent);
const TAGS = JSON.parse($("tagJson").textContent);
const CADCOL = JSON.parse($("cadColorJson").textContent || "{}");
const state = { alliance: "red", mode: "competition", sim: null, running: false, overhead: false, elec: [], gfx: "high" };

// ================= setup form =================
const seg = (a, b, key, va, vb, after) => {

  $("modeText").textContent = state.mode === "competition"

});
const showParse = () => {
  if (!state.sim) return;

$("gfx").addEventListener("change", () => applyQuality($("gfx").value));
fetch("gameplan.wasm").then((r) => { if (!r.ok) throw new Error("HTTP " + r.status); return r.arrayBuffer(); })
  .then(async (b) => { wasmBytes = b; state.sim = await GamePlanWasm.create(b, (l) => console.log(l)); $("loadState").textContent = "Simulation ready"; $("startBtn").disabled = false; showParse(); })
  .catch((e) => { $("loadState").textContent = "Could not load the simulation (" + e.message + "). Reload the page to retry."; });

// ================= renderer =================
const canvas = $("view");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: "high-performance" });
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
// ================= night sky (static), fog depth for the forest =================
{
  const W = 2048, Hs = 1024, c = document.createElement("canvas"); c.width = W; c.height = Hs; const g = c.getContext("2d");
  const gr = g.createLinearGradient(0, 0, 0, Hs);
  gr.addColorStop(0, "#02040a"); gr.addColorStop(0.35, "#061022"); gr.addColorStop(0.47, "#0f1a2c"); gr.addColorStop(0.5, "#141a20");
  gr.addColorStop(0.53, "#07090a"); gr.addColorStop(1, "#030404");
  g.fillStyle = gr; g.fillRect(0, 0, W, Hs);
  let sd = 97; const rnd = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 2600; i++) {   // stars, denser and brighter toward the zenith
    const y = Math.pow(rnd(), 1.6) * Hs * 0.47, x = rnd() * W, m = rnd();
    g.fillStyle = `rgba(${220 + 35 * rnd() | 0},${225 + 30 * rnd() | 0},255,${0.25 + 0.75 * m * (1 - y / (Hs * 0.5))})`;
    g.fillRect(x, y, m > 0.97 ? 2 : 1, m > 0.97 ? 2 : 1);
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.mapping = THREE.EquirectangularReflectionMapping;
  scene.background = t;
}
scene.fog = new THREE.FogExp2(0x070b10, 0.03);
const camera = new THREE.PerspectiveCamera(75, 1, 0.03, 260);
// GamePlan field frame (x to blue wall, y away from audience, z up) inside the three.js world (y up)
const gp = new THREE.Group(); gp.rotation.x = -Math.PI / 2; scene.add(gp);
const T = (x, y, z) => new THREE.Vector3(x, z, -y);
const F = season.field, H = F.halfSize_m;

// ================= arena lighting rig (light from above, like a championship field) =================
// A square truss 6.4 m above the field carries the fixtures. They light the field, the drive team
// areas and a little beyond; the forest outside only gets faint moonlight.
const RIG_H = 6.4, RIG = 3.9;
const pmrem = new THREE.PMREMGenerator(renderer);
{   // environment for reflections = the same surroundings: dark woods, bright fixtures overhead
  const es = new THREE.Scene(); es.background = new THREE.Color(0x030507);
  const lamp = new THREE.MeshBasicMaterial({ color: new THREE.Color(1, 0.97, 0.9).multiplyScalar(18), side: THREE.DoubleSide });
  for (const x of [-2.6, 0, 2.6]) for (const z of [-2.6, 0, 2.6]) {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(0.9, 0.5), lamp); m.position.set(x, RIG_H, z); m.rotation.x = Math.PI / 2; es.add(m);
  }
  // what metal and plastic on the field reflect: the brightly lit field and mats below, dim woods around
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.MeshBasicMaterial({ color: 0x1d2024 })); ground.rotation.x = -Math.PI / 2; es.add(ground);
  const field = new THREE.Mesh(new THREE.PlaneGeometry(9.5, 7.5), new THREE.MeshBasicMaterial({ color: new THREE.Color(0.55, 0.56, 0.58) })); field.rotation.x = -Math.PI / 2; field.position.y = 0.01; es.add(field);
  const ring = new THREE.Mesh(new THREE.CylinderGeometry(14, 14, 10, 32, 1, true), new THREE.MeshBasicMaterial({ color: 0x10140f, side: THREE.BackSide })); ring.position.y = 5; es.add(ring);
  scene.environment = pmrem.fromScene(es, 0.03).texture;

RectAreaLightUniformsLib.init();
const fill = new THREE.RectAreaLight(0xfff3e2, 1.4, 4.2, 4.2);   // the diffuse glow of the whole rig
fill.position.set(0, RIG_H - 0.3, 0); fill.lookAt(0, 0, 0); scene.add(fill);
const fixtures = [];
for (const [x, z] of [[-RIG, -RIG], [RIG, -RIG], [-RIG, RIG], [RIG, RIG], [0, -RIG], [0, RIG], [-RIG, 0], [RIG, 0]]) {
  const s = new THREE.SpotLight(0xfff1df, 40, 0, 0.5, 0.45, 2);
  s.position.set(x, RIG_H, z);
  s.target.position.set(-x * 0.18, 0, -z * 0.18);              // cross-lighting softens shadows
  s.shadow.bias = -0.00015; s.shadow.normalBias = 0.02; s.shadow.radius = 5;
  s.shadow.camera.near = 2; s.shadow.camera.far = 14;
  scene.add(s, s.target); fixtures.push(s);
}
const moon = new THREE.DirectionalLight(0x9db4dc, 0.45); moon.position.set(-30, 40, 20); scene.add(moon);
scene.add(new THREE.HemisphereLight(0x2c3f5e, 0x0c0e0a, 0.22));

// post-processing: MSAA scene target, ground-truth ambient occlusion (Ultra), tone mapping
let composer = null, aoPass = null, bloomPass = null;
function buildComposer() {
  const rt = new THREE.WebGLRenderTarget(2, 2, { type: THREE.HalfFloatType, samples: 4 });
  composer = new EffectComposer(renderer, rt);
  composer.addPass(new RenderPass(scene, camera));
  aoPass = new GTAOPass(scene, camera, 2, 2);
  aoPass.updateGtaoMaterial({ radius: 0.35, distanceExponent: 1.5, thickness: 0.6, scale: 1.0 });
  composer.addPass(aoPass);
  bloomPass = new UnrealBloomPass(new THREE.Vector2(256, 256), 0.18, 0.35, 1.05);   // glare around the fixture lenses only
  composer.addPass(bloomPass);

}
function applyQuality(q) {
  state.gfx = q;
  const ultra = q === "ultra", bal = q === "balanced";
  renderer.setPixelRatio(Math.min(bal ? 1 : 2, window.devicePixelRatio || 1));
  // shadow-casting fixtures: 4 (Ultra), 2 (High), 1 (Balanced); the rest light without shadows
  const casters = ultra ? [0, 3, 1, 2] : bal ? [0] : [0, 3];
  fixtures.forEach((s, i) => {
    s.castShadow = casters.includes(i);
    s.shadow.mapSize.set(ultra ? 2048 : 1024, ultra ? 2048 : 1024);
    if (s.shadow.map) { s.shadow.map.dispose(); s.shadow.map = null; }
  });

  aoPass.enabled = !bal;          // contact shading (ambient occlusion) on High and Ultra
  bloomPass.enabled = !bal;

// ================= materials (physically based; CAD colours where the STEP carries them) =================
const M = {};
const std = (o) => new THREE.MeshStandardMaterial(o);
const phys = (o) => new THREE.MeshPhysicalMaterial(o);
function noiseTex(size, base, amp, seed = 1) {   // fine foam / powder-coat texture

  const g = c.getContext("2d"), img = g.createImageData(size, size);

  for (let i = 0; i < size * size; i++) { s = (s * 16807) % 2147483647; const v = base + (s / 2147483647 - 0.5) * amp; img.data.set([v, v, v, 255], i * 4); }

}
M.tile = std({ color: 0x5f6266, roughness: 0.93, metalness: 0, bumpMap: noiseTex(256, 128, 90, 7), bumpScale: 0.6 });
M.tile.bumpMap.repeat.set(9, 9);
// brushed / bead-blasted aluminium (field structures are not mirror-polished)
M.alu = std({ color: 0xc8cdd2, metalness: 0.85, roughness: 0.42 });
M.aluDark = std({ color: 0x2c3036, metalness: 0.55, roughness: 0.5 });
M.steel = std({ color: 0x9da3a8, metalness: 1, roughness: 0.25 });
M.blackOxide = std({ color: 0x1b1c1e, metalness: 0.8, roughness: 0.45 });
// clear polycarbonate (perimeter panels, robot guards): refracts what is behind it, faint blue-grey body tint
M.poly = phys({ color: 0xffffff, metalness: 0, roughness: 0.035, transmission: 1, thickness: 0.0047, ior: 1.585,
  attenuationColor: new THREE.Color(0xdfe9ee), attenuationDistance: 0.25, specularIntensity: 1, side: THREE.DoubleSide });
M.poly.userData.noShadow = true;   // clear sheet casts almost no shadow
// thin frosted plastic sheet (HIVE skins): lets a little light through, scatters it, keeps its colour
const frosted = (color) => phys({ color, roughness: 0.42, transmission: 0.38, thickness: 0.0016, ior: 1.49,
  attenuationColor: color, attenuationDistance: 0.02, side: THREE.DoubleSide });
M.nylonBlack = std({ color: 0x18191a, roughness: 0.55 });
M.whitePlastic = std({ color: 0xebebe8, roughness: 0.5 });
M.acm = std({ color: 0xf1f1ee, roughness: 0.38, metalness: 0.05 });
M.redPlastic = std({ color: 0xc8261e, roughness: 0.45 });
M.bluePlastic = std({ color: 0x1f56c4, roughness: 0.45 });
M.redSkin = phys({ color: 0xd2382e, roughness: 0.3, transmission: 0.35, thickness: 0.002, transparent: true, side: THREE.DoubleSide });
M.blueSkin = phys({ color: 0x2f6fd8, roughness: 0.3, transmission: 0.35, thickness: 0.002, transparent: true, side: THREE.DoubleSide });
M.redTape = std({ color: 0xc8231c, roughness: 0.85 });
M.blueTape = std({ color: 0x1c4fbf, roughness: 0.85 });
M.rubber = std({ color: 0x141414, roughness: 0.82 });
M.floor = std({ color: 0x1b1d20, roughness: 0.95, bumpMap: noiseTex(256, 128, 40, 3), bumpScale: 0.4 });
M.floor.bumpMap.repeat.set(30, 30);
const cadColour = (name) => {   // colour assigned to this part in the official STEP, if any
  const c = CADCOL[name.split("/").pop()];
  return c && c.length ? new THREE.Color().setRGB(c[0], c[1], c[2], THREE.SRGBColorSpace) : null;
};
function materialFor(name, group) {
  const n = name.toLowerCase();
  let m;
  if (group === "tiles") m = M.tile;
  else if (group === "tape") m = n.includes("red") ? M.redTape : M.blueTape;
  else if (/glass|polycarb/.test(n)) m = M.poly;
  else if (/rivet|screw|bolt|nut|washer|pin\b|quick release/.test(n)) m = /lock nut|black|oxide/.test(n) ? M.blackOxide : M.steel;
  else if (/cable tie|plug|nylon/.test(n)) m = M.nylonBlack;
  else if (/skin/.test(n)) m = frosted(cadColour(name) || new THREE.Color(0xe6e6e6));
  else if (/goal rib/.test(n)) m = group.includes("red") ? M.redPlastic : M.bluePlastic;
  else if (/acm|panel sticker/.test(n)) m = M.acm;
  else if (/hips|flower|peanut|backstop/.test(n)) m = M.whitePlastic;
  else if (/a-frame leg|top bar|under tile bar|sheet metal foot/.test(n)) m = M.alu;
  else if (/top corner|frame foot|axle holder|damper holder|field bracket|rail/.test(n)) m = M.aluDark;
  else if (/flower layer|backstop/.test(n)) m = M.whitePlastic;
  else m = M.alu;
  const cc = cadColour(name);
  if (cc && m !== M.poly && !/skin/.test(n) && group !== "tiles") { m = m.clone(); m.color = cc; }   // the designers' part colour
  return m;
}

// ================= AprilTag stickers (real tag36h11 codes for IDs 30-45, SDK 12 cluster layout) =================
function tagStickerTexture(ids) {
  const IN = 0.0254, W = 17.0 * IN, Hh = 4.1 * IN, px = 1400;
  const c = document.createElement("canvas"); c.width = px; c.height = Math.round(px * Hh / W);
  const g = c.getContext("2d"); g.fillStyle = "#f7f7f5"; g.fillRect(0, 0, c.width, c.height);
  const s = px / W, size = 3.25 * IN * s, cell = size / 10;
  [-6.5, -2.75, 2.75, 6.5].forEach((xin, k) => {
    const code = TAGS[ids[k]]; if (!code) return;
    const x0 = (W / 2 + xin * IN) * s - size / 2, y0 = c.height / 2 - size / 2;
    for (let r = 0; r < 10; r++) for (let q = 0; q < 10; q++) { g.fillStyle = code[r * 10 + q] === "1" ? "#f7f7f5" : "#111"; g.fillRect(x0 + q * cell, y0 + r * cell, cell + 0.6, cell + 0.6); }
    g.fillStyle = "#555"; g.font = `${Math.round(cell * 0.9)}px IBM Plex Mono, monospace`; g.fillText(String(ids[k]), x0, y0 + size + cell * 1.1);
  });
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return { tex: t, W, Hh };
}
function applySticker(mesh, ids, pivot) {
  const pos = mesh.geometry.attributes.position, n = pos.count;
  const c = new THREE.Vector3(); for (let i = 0; i < n; i++) c.add(new THREE.Vector3().fromBufferAttribute(pos, i)); c.multiplyScalar(1 / n);
  // plane normal by power iteration on the covariance (smallest axis = largest of the inverse proxy)
  const cov = [[0, 0, 0], [0, 0, 0], [0, 0, 0]], v = new THREE.Vector3();
  for (let i = 0; i < n; i++) { v.fromBufferAttribute(pos, i).sub(c); const a = [v.x, v.y, v.z]; for (let r = 0; r < 3; r++) for (let q = 0; q < 3; q++) cov[r][q] += a[r] * a[q]; }
  const mul = (m, x) => new THREE.Vector3(m[0][0] * x.x + m[0][1] * x.y + m[0][2] * x.z, m[1][0] * x.x + m[1][1] * x.y + m[1][2] * x.z, m[2][0] * x.x + m[2][1] * x.y + m[2][2] * x.z);
  let e1 = new THREE.Vector3(1, 0.3, 0.2); for (let k = 0; k < 40; k++) e1 = mul(cov, e1).normalize();
  const tr = cov[0][0] + cov[1][1] + cov[2][2];
  const shifted = cov.map((row, r) => row.map((x, q) => (r === q ? tr : 0) - x));
  let nrm = new THREE.Vector3(0.2, 0.3, 1); for (let k = 0; k < 60; k++) { nrm = mul(shifted, nrm); nrm.sub(e1.clone().multiplyScalar(nrm.dot(e1))).normalize(); }
  nrm = e1.clone().cross(nrm).normalize();   // third axis = smallest variance = plane normal
  if (nrm.dot(c.clone().sub(pivot)) < 0) nrm.negate();   // outward, away from the HIVE body
  const up = new THREE.Vector3(0, 0, 1), yUp = up.clone().sub(nrm.clone().multiplyScalar(up.dot(nrm))).normalize();
  const xr = yUp.clone().cross(nrm).normalize();          // right, as seen facing the tags
  const { tex, W, Hh } = tagStickerTexture(ids);
  const uv = new Float32Array(n * 2);
  for (let i = 0; i < n; i++) { v.fromBufferAttribute(pos, i).sub(c); uv[2 * i] = 0.5 + v.dot(xr) / W; uv[2 * i + 1] = 0.5 + v.dot(yUp) / Hh; }
  mesh.geometry.setAttribute("uv", new THREE.BufferAttribute(uv, 2));
  mesh.material = std({ map: tex, roughness: 0.55 });
}

// ================= field from the official CAD =================
const loader = new GLTFLoader();
const hives = [null, null];
const hiveCadAngle = [0, F.hives[1].initialUpCell.includes("scoring") ? F.hives[1].stateAngle_rad : 0];   // CAD pose: red audience up, blue scoring up
const stickerIds = { "red goal april tag (audience)": [34, 35, 36, 37], "red goal april tag (scoring)": [30, 31, 32, 33],
  "blue goal april tag (audience)": [38, 39, 40, 41], "blue goal april tag (scoring)": [42, 43, 44, 45] };
// The viewer's security policy forbids fetching data: URIs, so each CAD file ships as a GLB in base64
// inside a .json file (a relative fetch, allowed) and is parsed in memory.
async function fetchGLB(name) {
  const r = await fetch(`assets/field/${name}.glb.json`);
  if (!r.ok) throw new Error(name + ": HTTP " + r.status);
  const b64 = (await r.json()).glb, bin = atob(b64), u8 = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  return new Promise((res, rej) => loader.parse(u8.buffer, "", res, rej));
}
const assetFail = [];
function loadGroup(group, parent) {
  return fetchGLB(group).then((g) => {
    g.scene.traverse((o) => {
      if (!o.isMesh) return;
      const nm = o.name || (o.parent && o.parent.name) || "";
      o.material = materialFor(nm, group);
      o.castShadow = group !== "tiles" && group !== "tape" && !o.material.userData.noShadow;
      o.receiveShadow = true;
      const lk = nm.split("/").pop().toLowerCase().replace(/^am-5888-(red|blue)[12]: /, "");
      if (stickerIds[lk]) { const h = group === "hive_red" ? 0 : 1; const pv = F.hives[h].pivot; applySticker(o, stickerIds[lk], new THREE.Vector3(pv[0], pv[1], pv[2])); }
    });
    parent.add(g.scene);
    if (group === "perimeter") splitWalls(g.scene);
    return true;
  }).catch((e) => { assetFail.push(group); console.warn("CAD asset failed:", e); return false; });
}
const ballGeo = { pollen: null, nectar: null, pollen_lod1: null, nectar_lod1: null };
async function loadField() {
  $("assetState").textContent = "Loading official field CAD…";
  const groups = ["perimeter", "tape", "frame", "flowers", "trays"];
  buildTiles();
  const ok = await Promise.all(groups.map((g) => loadGroup(g, gp)));
  for (let h = 0; h < 2; h++) {
    const pv = F.hives[h].pivot, piv = new THREE.Group(), inner = new THREE.Group();
    piv.position.set(pv[0], pv[1], pv[2]); inner.position.set(-pv[0], -pv[1], -pv[2]);
    piv.add(inner); gp.add(piv); hives[h] = piv;
    ok.push(await loadGroup(h ? "hive_blue" : "hive_red", inner));
  }
  const geo = (name) => fetchGLB(name).then((g) => { let m = null; g.scene.traverse((o) => { if (o.isMesh && !m) m = o.geometry; }); return m; }).catch(() => { assetFail.push(name); return null; });
  ballGeo.pollen = await geo("pollen"); ballGeo.nectar = await geo("nectar");
  ballGeo.pollen_lod1 = await geo("pollen_lod1"); ballGeo.nectar_lod1 = await geo("nectar_lod1");
  buildBalls();
  if (!assetFail.length) $("assetState").textContent = "";
  else { $("assetState").textContent = "Some field CAD could not be loaded (" + assetFail.join(", ") + "); simplified models are shown for them."; fallbackField(assetFail); }
}
// FTC soft tiles: 6 x 6 interlocking 24 in EVA foam tiles (the CAD solids are too fine to decimate well)
function buildTiles() {
  const px = 2048, c = document.createElement("canvas"); c.width = c.height = px;
  const g = c.getContext("2d"), n = 6, s = px / n;
  let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) { const v = 92 + Math.round((rnd() - 0.5) * 8); g.fillStyle = `rgb(${v},${v + 2},${v + 5})`; g.fillRect(i * s, j * s, s, s); }
  const img = g.getImageData(0, 0, px, px);   // foam grain
  for (let k = 0; k < img.data.length; k += 4) { const d = (rnd() - 0.5) * 10; img.data[k] += d; img.data[k + 1] += d; img.data[k + 2] += d; }

  for (let i = 1; i < n; i++) for (const vert of [true, false]) {   // interlock teeth along every seam
    g.beginPath();
    for (let t = 0; t <= 48; t++) { const a = t * px / 48, b = i * s + (t % 2 ? 3 : -3); vert ? (t ? g.lineTo(b, a) : g.moveTo(b, a)) : (t ? g.lineTo(a, b) : g.moveTo(a, b)); }
    g.stroke();
  }
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
  const mat = std({ map: tex, roughness: 0.94, bumpMap: noiseTex(512, 128, 70, 5), bumpScale: 0.5 });

}

// ================= match loop =================
$("setupForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  state.sim = await GamePlanWasm.create(wasmBytes, (l) => console.log(l));   // fresh world per match
  robots.forEach((r) => gp.remove(r.g)); robots.length = 0;
  const robot = $("robotJson").textContent;
  state.sim.init($("seasonJson").textContent, $("compsJson").textContent, robot, robot, {
    seed: +$("seed").value || 1, alliance: state.alliance, mode: state.mode, difficulty: +$("diff").value,
    opponentPersonality: $("opp").value, partnerPersonality: "coordinated", partnerInstruction: $("instr").value, uncertainty: "realistic" });
  state.elec = []; state.running = true; state.overhead = false;
  placeDriver();
  ["hud", "conn", "keys", "viewBtns"].forEach((id) => { $(id).hidden = false; });
  $("touch").hidden = !isTouch; document.body.classList.toggle("touch-on", isTouch);
  $("setup").hidden = true; $("toast").hidden = true; $("report").hidden = true;
  renderUpdates();   // hides the update bar for the duration of the match
  audio.start(); lastMatchT = -99; perf.reset();
  canvas.focus();
});
let last = performance.now(), elecT = -1, lastSize = "";
// everything that follows one simulation step: poses, HUD, hints, sound cues, electrical log, end
function afterStep(done) {
  draw(state.sim.frame());
  const h = state.sim.hud();
  $("timer").textContent = h.timer; $("phase").textContent = h.phase.replace("_", " ") + (state.mode === "practice" ? " · practice" : "");
  $("sRed").textContent = h.red; $("sBlue").textContent = h.blue;
  $("connText").textContent = h.connection; $("conn").classList.toggle("bad", h.connection !== "Connected");
  const mt = state.sim.frame()[0] - 3.0;   // match time (the browser build starts the match after 3 s of pre-match)
  cueAt(mt);
  const hint = h.phase === "AUTO" && state.mode === "competition" ? "AUTO: your robot has no autonomous program here, so it waits. You drive when TELEOP starts at 2:00."
    : h.phase === "TRANSITION" ? "Pick up the controller: TELEOP starts in a few seconds." : "";
  $("hint").textContent = hint; $("hint").hidden = !hint;
  const el = state.sim.elec();
  if (el[0] - elecT >= 0.1) { elecT = el[0]; state.elec.push(Array.from(el)); }   // stored now, shown only after the match

}
function frame(now) {

  const dt = Math.min(0.1, (now - last) / 1000); last = now;

// ---- keep it playable: if frames are slow during a match, step the graphics down once per level
const perf = { n: 0, sum: 0, reset() { this.n = 0; this.sum = 0; }, sample(dt) {
  this.n++; this.sum += dt;
  if (this.n < 150) return;
  const ms = this.sum / this.n * 1000; this.reset();
  const order = ["ultra", "high", "balanced"], i = order.indexOf(state.gfx);
  if (ms > 33 && i < order.length - 1) {
    applyQuality(order[i + 1]); $("gfx").value = order[i + 1];
    $("note2").textContent = `Graphics lowered to ${order[i + 1]} for smoother play (${Math.round(1000 / ms)} fps)`;
    $("note2").hidden = false; setTimeout(() => { $("note2").hidden = true; }, 6000);
  }

// ---- match sound cues (season.audioCues timing; synthesized substitutes, not the official recordings)
const audio = { ctx: null, start() { try { this.ctx = this.ctx || new (window.AudioContext || window.webkitAudioContext)(); this.ctx.resume(); } catch (_) { this.ctx = null; } } };

  o.connect(g).connect(c.destination); o.start(t0); o.stop(t0 + dur + 0.05);
}
const CUE_SOUND = {
  "Cavalry Charge": () => [392, 523, 659, 784, 659, 784].forEach((f, i) => tone(f, i * 0.16, i === 5 ? 0.6 : 0.14, "triangle", 0.22)),
  "Buzzer x3": () => [0, 0.45, 0.9].forEach((t) => tone(110, t, 0.35, "square", 0.12)),
  "3 Bells": () => [0, 0.5, 1.0].forEach((t) => { tone(1320, t, 1.1, "sine", 0.2); tone(2640, t, 0.6, "sine", 0.06); }),
  "Chime": () => { tone(1046, 0, 1.2, "sine", 0.2); tone(1568, 0.25, 1.2, "sine", 0.15); },
  "Train Whistle": () => { tone(587, 0, 1.0, "sawtooth", 0.08, 20); tone(740, 0, 1.0, "sawtooth", 0.07, 20); },
  "3-second Buzzer": () => tone(98, 0, 3.0, "square", 0.12),

let lastMatchT = -99;
function cueAt(mt) {
  for (const c of season.audioCues || []) {
    if (c.atMatchTime_s < 0 || !CUE_SOUND[c.cue]) continue;
    if (lastMatchT < c.atMatchTime_s && mt >= c.atMatchTime_s) CUE_SOUND[c.cue]();
  }
  lastMatchT = mt;
}
function leaveMatch() {
  if (!state.running) return;
  state.running = false;

  document.body.classList.remove("touch-on");
  $("setup").hidden = false; renderUpdates();
}
$("leaveBtn").onclick = leaveMatch;
addEventListener("keydown", (e) => { if (e.code === "Escape" && state.running) leaveMatch(); });
function resize() {
  const w = canvas.clientWidth, h = canvas.clientHeight, key2 = w + "x" + h + "@" + renderer.getPixelRatio();
  if (key2 === lastSize) return;
  lastSize = key2;
  renderer.setSize(w, h, false); composer.setPixelRatio(renderer.getPixelRatio()); composer.setSize(w, h);
  camera.aspect = w / Math.max(1, h); camera.updateProjectionMatrix();
}
function finish() { state.running = false; ["keys", "touch", "hint"].forEach((id) => { $(id).hidden = true; }); $("toast").hidden = false; renderUpdates(); }
$("dismiss").onclick = () => { $("toast").hidden = true; $("setup").hidden = false; ["hud", "conn", "viewBtns"].forEach((id) => { $(id).hidden = true; }); };
$("openReport").onclick = () => { $("toast").hidden = true; renderReport(); $("report").hidden = false; };

// ================= post-match report =================
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function chart(cv, series, unit) {
  const dpr = Math.min(2, devicePixelRatio || 1), W = cv.clientWidth * dpr, Hh = cv.clientHeight * dpr;
  cv.width = W; cv.height = Hh; const c = cv.getContext("2d");
  const pad = { l: 44 * dpr, r: 10 * dpr, t: 12 * dpr, b: 22 * dpr };
  const xs = state.elec.map((r) => r[0]);
  let lo = Infinity, hi = -Infinity; series.forEach((s) => state.elec.forEach((r) => { lo = Math.min(lo, r[s.i]); hi = Math.max(hi, r[s.i]); }));
  if (!isFinite(lo)) return; if (hi - lo < 1e-6) { hi += 1; lo -= 1; } const m = (hi - lo) * 0.08; lo -= m; hi += m;
  const X = (x) => pad.l + (x - xs[0]) / Math.max(1e-6, xs[xs.length - 1] - xs[0]) * (W - pad.l - pad.r);
  const Y = (y) => pad.t + (1 - (y - lo) / (hi - lo)) * (Hh - pad.t - pad.b);
  c.font = `${11 * dpr}px IBM Plex Mono, monospace`; c.fillStyle = "#8e9aa5"; c.strokeStyle = "#2b343d"; c.lineWidth = dpr;
  for (let k = 0; k <= 4; k++) { const v = lo + (hi - lo) * k / 4, y = Y(v); c.beginPath(); c.moveTo(pad.l, y); c.lineTo(W - pad.r, y); c.stroke(); c.fillText(v.toFixed(1), 4 * dpr, y + 4 * dpr); }
  c.fillText(unit, 4 * dpr, 10 * dpr);
  [38, 98, 138].forEach((t) => { const x = X(t); if (x > pad.l && x < W - pad.r) { c.setLineDash([3 * dpr, 4 * dpr]); c.beginPath(); c.moveTo(x, pad.t); c.lineTo(x, Hh - pad.b); c.stroke(); c.setLineDash([]); } });
  series.forEach((s) => { c.strokeStyle = s.color; c.lineWidth = 1.6 * dpr; c.beginPath(); state.elec.forEach((r, i) => { const x = X(r[0]), y = Y(r[s.i]); i ? c.lineTo(x, y) : c.moveTo(x, y); }); c.stroke(); });
}
function renderReport() {
  const r = state.sim.result(), u = r.userRobotElectrical;
  const rows = (a) => Object.entries(r[a].breakdown).map(([k, v]) => `<tr><td>${esc(k.replace(/_/g, " "))}</td><td>${v}</td></tr>`).join("") + `<tr><td>Foul credit</td><td>${r[a].foulCredit}</td></tr>`;
  const viol = r.violations.length ? r.violations.map((v) => `<tr><td>${v.matchTime.toFixed(1)} s</td><td>${esc(v.rule)} <span class="tag">${v.judgment ? "judgment" : "objective"}</span></td><td>${esc(v.offender)}</td><td>${esc(v.penalty)}</td><td>${esc(v.rationale)}</td></tr>`).join("") : `<tr><td colspan="5">No violations assessed.</td></tr>`;
  const motors = u.motors.map((m) => `<tr><td>${esc(m.name)}</td><td>${m.energy_J.toFixed(0)}</td><td>${m.peak_A.toFixed(1)}</td><td>${m.winding_C.toFixed(0)}</td></tr>`).join("");
  const pd = r.partnerDirectives || { matched: [], notUnderstood: [] };
  $("reportCard").innerHTML = `
    <div class="row"><h1>Match report</h1><span class="tag">${esc(season.manual.teamUpdate)} · ${esc(season.rulesEngineVersion)} · seed ${+$("seed").value}${state.mode === "practice" ? " · PRACTICE" : ""}</span></div>
    <div class="bigscore"><span class="r">${r.red.total}</span><span class="vs">vs</span><span class="b">${r.blue.total}</span><span class="tag">RP red ${r.red.rp} · blue ${r.blue.rp}</span></div>
    <div class="grid"><div class="tbl-wrap"><table><tr><th>Red</th><th>pts</th></tr>${rows("red")}</table></div><div class="tbl-wrap"><table><tr><th>Blue</th><th>pts</th></tr>${rows("blue")}</table></div></div>
    <h2>Violations</h2><div class="tbl-wrap"><table><tr><th>Time</th><th>Rule</th><th>Alliance</th><th>Penalty</th><th>Basis</th></tr>${viol}</table></div>
    <h2>Your robot's electrical system</h2>
    <p class="lede">Collected during the match and shown only now. Min hub bus ${u.minHubBusV.toFixed(2)} V, peak battery current ${u.peakBatteryA.toFixed(1)} A, ${(u.energy_J / 1000).toFixed(2)} kJ used, final charge ${(u.finalSoc * 100).toFixed(1)} %, ${r.distance_m.toFixed(1)} m driven. Values are calculated by the coupled model; component data carries provenance in the GamePlan repository.</p>
    <canvas class="chart" id="cV" aria-label="Battery terminal and hub bus voltage over the match"></canvas>
    <canvas class="chart" id="cI" aria-label="Battery current over the match"></canvas>
    <div class="tbl-wrap"><table><tr><th>Motor</th><th>Energy J</th><th>Peak A</th><th>Winding °C</th></tr>${motors}</table></div>
    <h2>Alliance partner</h2>
    <p class="lede">${pd.matched.length ? "Followed: " + pd.matched.map(esc).join("; ") : "Played its default strategy."}${pd.notUnderstood && pd.notUnderstood.length ? " Not understood: " + pd.notUnderstood.map(esc).join("; ") : ""}</p>
    <div class="row"><span class="parsed">Dashed lines: TELEOP start, FLOWER unlock (1:00), final 20 s.</span><button type="button" id="again">Set up another match</button></div>`;
  chart($("cV"), [{ i: 1, color: "#f2c230" }, { i: 3, color: "#4fbf7a" }], "V  battery · hub");
  chart($("cI"), [{ i: 2, color: "#e0453a" }], "A  battery");
  $("again").onclick = () => { $("report").hidden = true; $("setup").hidden = false; ["hud", "conn", "viewBtns"].forEach((id) => { $(id).hidden = true; }); };
}


// ================= updates: a bar when a newer version is out, plus About > Check for updates =================
// The live "latest release" record is kept in the artifact database (outside page versions: an open
// page's own files always belong to the version it loaded). The bar only appears between matches -
// on the setup screen or after the final buzzer - never over a running match.
const BUILD = JSON.parse($("buildJson").textContent);
const upd = { latest: null, db: null, ref: null, dismissed: null, tried: null };
const semver = (v) => String(v || "0").split(".").map((x) => parseInt(x, 10) || 0);
const newer = (a, b) => { const x = semver(a), y = semver(b); for (let i = 0; i < 3; i++) if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) > (y[i] || 0); return false; };
const store = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (_) { return null; } };

upd.dismissed = store("gp.update.dismissed");
upd.tried = sstore("gp.update.target");
$("aboutVer").textContent = BUILD.version;
function updateAvailable() { return upd.latest && newer(upd.latest.version, BUILD.version); }
function renderUpdates() {
  const avail = updateAvailable(), L = upd.latest;
  // About panel (always reachable from the setup screen)
  $("aboutState").classList.toggle("new", !!avail);
  $("aboutState").textContent = !upd.db ? "Update checks need you to be signed in to claude.ai"
    : !L ? "Checking for updates…" : avail ? `Version ${L.version} is available` : "You have the latest version";
  $("aboutUpdate").hidden = !avail;
  const ul = $("aboutNotes"); ul.hidden = !avail || !(L.notes || []).length;
  ul.replaceChildren(...(avail ? L.notes : []).map((n) => { const li = document.createElement("li"); li.textContent = n; return li; }));
  // the bar: right time (not while driving), right reason (newer and not dismissed, or required)
  const stillOld = avail && upd.tried === L.version;   // an update was started but this view is still the old version
  const show = avail && !state.running && (L.required || upd.dismissed !== L.version || stillOld);
  $("updBar").hidden = !show; document.body.classList.toggle("has-updbar", show);
  if (!show) return;
  $("updX").hidden = !!L.required;
  const msg = $("updMsg"); msg.replaceChildren();
  const b = document.createElement("b"); b.textContent = stillOld ? "Almost there" : (L.required ? "Update required" : "Update available");
  const sp = document.createElement("span");
  sp.textContent = stillOld ? ` · this window still shows ${BUILD.version}. Close and reopen GamePlan to finish updating to ${L.version}.`
    : ` · GamePlan ${L.version}${L.notes && L.notes[0] ? " — " + L.notes[0] : ""}`;
  msg.append(b, sp);
  $("updNow").textContent = stillOld ? "Try again" : "Update now";
}
function applyUpdate() {
  if (!updateAvailable()) return;
  if (state.running) return;                           // never interrupts a match
  sstore("gp.update.target", upd.latest.version);
  store("gp.update.dismissed", null);
  // Opening the GamePlan link always serves the newest version: reload this view onto it.
  $("updNow").disabled = $("aboutUpdate").disabled = true; $("updNow").textContent = "Updating\u2026";
  // a sandboxed frame may silently refuse top navigation, so a frame reload follows if we are still here
  if (upd.latest.webUrl) { try { window.top.location.href = upd.latest.webUrl; } catch (_) { /* refused */ } }
  setTimeout(() => location.reload(), 900);
}
$("updNow").onclick = applyUpdate;
$("aboutUpdate").onclick = applyUpdate;
$("updX").onclick = () => { if (!upd.latest) return; upd.dismissed = upd.latest.version; store("gp.update.dismissed", upd.dismissed); renderUpdates(); };
$("aboutCheck").onclick = async () => {
  if (!upd.ref) { renderUpdates(); return; }
  $("aboutState").textContent = "Checking for updates…";
  try { const snap = await upd.ref.get(); if (snap.exists) upd.latest = snap.data(); } catch (_) { /* keep the last known state */ }
  // an explicit check brings the bar back even if this version was dismissed earlier
  if (updateAvailable() && upd.dismissed === upd.latest.version) { upd.dismissed = null; store("gp.update.dismissed", null); }
  renderUpdates();
};
if (upd.tried && !newer(upd.tried, BUILD.version)) sstore("gp.update.target", null);   // the update landed
(async () => {
  const db = window.claude && window.claude.use ? await window.claude.use("db") : null;
  if (!db) { renderUpdates(); return; }
  upd.db = db; upd.ref = db.doc("releases/latest");
  upd.ref.onSnapshot((snap) => { upd.latest = snap.exists ? snap.data() : null; renderUpdates(); }, () => renderUpdates());
  renderUpdates();
})();

applyQuality(state.gfx);
placeDriver();
drawStandMap();
loadField();
requestAnimationFrame(frame);
// test hook for automated screenshots (no effect on play)
window.__gp = { THREE, scene, camera, state, draw, placeDriver, look, robots,
  renderFrame: (noLook) => { if (!noLook) applyLook(); resize(); composer.render(); },
  advance: (s) => { for (let t = 0; t < s && state.running; t += 0.05) { state.sim.setPad(readPad(0.05)); afterStep(state.sim.step(0.05)); } } };
</script>
