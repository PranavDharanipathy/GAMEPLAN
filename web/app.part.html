<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

const $ = (id) => document.getElementById(id);
const season = JSON.parse($("seasonJson").textContent);
const TAGS = JSON.parse($("tagJson").textContent);
const CADCOL = JSON.parse($("cadColorJson").textContent || "{}");
const state = { alliance: "red", mode: "competition", sim: null, running: false, overhead: false, elec: [], gfx: "high" };
let wasmBytes = null;

// ================= setup form =================
const seg = (a, b, key, va, vb, after) => {
  $(a).onclick = () => { state[key] = va; $(a).setAttribute("aria-pressed", "true"); $(b).setAttribute("aria-pressed", "false"); after && after(); };
  $(b).onclick = () => { state[key] = vb; $(b).setAttribute("aria-pressed", "true"); $(a).setAttribute("aria-pressed", "false"); after && after(); };
};
seg("aRed", "aBlue", "alliance", "red", "blue", () => placeDriver());
seg("mComp", "mPrac", "mode", "competition", "practice", () => {
  $("modeText").textContent = state.mode === "competition"
    ? "Competition: your robot sits still during AUTO (no autonomous program in the browser build), you drive in TELEOP."
    : "Practice: you may drive during AUTO. Results are labelled practice and are not competition-accurate.";
});
const showParse = () => {
  if (!state.sim) return;

$("instr").addEventListener("input", showParse);
$("gfx").addEventListener("change", () => applyQuality($("gfx").value));

// ================= renderer =================

const scene = new THREE.Scene();
{   // venue backdrop: dark hall with a faint warm glow from the stands and lighting truss

// venue lighting: an overhead key (crisp contact shadows) + two truss spots + soft sky fill
const key = new THREE.DirectionalLight(0xfff4e8, 1.7);
key.position.set(1.4, 9, 2.2); key.castShadow = true;

  const s = new THREE.SpotLight(0xffffff, 150, 0, 0.62, 0.55, 2);
  s.position.set(x, y, z); s.target.position.set(0, 0, 0); s.castShadow = true;

// post-processing: MSAA scene target, ground-truth ambient occlusion (Ultra), tone mapping
let composer = null, aoPass = null;
function buildComposer() {
  const rt = new THREE.WebGLRenderTarget(2, 2, { type: THREE.HalfFloatType, samples: 4 });
  composer = new EffectComposer(renderer, rt);
  composer.addPass(new RenderPass(scene, camera));

  aoPass.updateGtaoMaterial({ radius: 0.35, distanceExponent: 1.5, thickness: 0.6, scale: 1.0 });

function applyQuality(q) {

  spots.forEach((s) => { s.castShadow = !bal; s.shadow.mapSize.set(ultra ? 2048 : 1024, ultra ? 2048 : 1024); });

const M = {};

M.bluePlastic = std({ color: 0x1f56c4, roughness: 0.45 });

M.blueTape = std({ color: 0x1c4fbf, roughness: 0.85 });

const cadColour = (name) => {   // colour assigned to this part in the official STEP, if any
  const c = CADCOL[name.split("/").pop()];

  else if (/glass|polycarb/.test(n)) m = M.poly;
  else if (/rivet|screw|bolt|nut|washer|pin\b|quick release/.test(n)) m = /lock nut|black|oxide/.test(n) ? M.blackOxide : M.steel;

// ================= AprilTag stickers (real tag36h11 codes for IDs 30-45, SDK 12 cluster layout) =================
function tagStickerTexture(ids) {
  const IN = 0.0254, W = 17.0 * IN, Hh = 4.1 * IN, px = 1400;
  const c = document.createElement("canvas"); c.width = px; c.height = Math.round(px * Hh / W);
  const g = c.getContext("2d"); g.fillStyle = "#f7f7f5"; g.fillRect(0, 0, c.width, c.height);
  const s = px / W, size = 3.25 * IN * s, cell = size / 10;
  [-6.5, -2.75, 2.75, 6.5].forEach((xin, k) => {
    const code = TAGS[ids[k]]; if (!code) return;
    const x0 = (W / 2 + xin * IN) * s - size / 2, y0 = c.height / 2 - size / 2;
    for (let r = 0; r < 10; r++) for (let q = 0; q < 10; q++) { g.fillStyle = code[r * 10 + q] === "1" ? "#f7f7f5" : "#111"; g.fillRect(x0 + q * cell, y0 + r * cell, cell + 0.6, cell + 0.6); }
    g.fillStyle = "#555"; g.font = `${Math.round(cell * 0.9)}px IBM Plex Mono, monospace`; g.fillText(String(ids[k]), x0, y0 + size + cell * 1.1);
  });

}
function applySticker(mesh, ids, pivot) {
  const pos = mesh.geometry.attributes.position, n = pos.count;
  const c = new THREE.Vector3(); for (let i = 0; i < n; i++) c.add(new THREE.Vector3().fromBufferAttribute(pos, i)); c.multiplyScalar(1 / n);
  // plane normal by power iteration on the covariance (smallest axis = largest of the inverse proxy)
  const cov = [[0, 0, 0], [0, 0, 0], [0, 0, 0]], v = new THREE.Vector3();
  for (let i = 0; i < n; i++) { v.fromBufferAttribute(pos, i).sub(c); const a = [v.x, v.y, v.z]; for (let r = 0; r < 3; r++) for (let q = 0; q < 3; q++) cov[r][q] += a[r] * a[q]; }
  const mul = (m, x) => new THREE.Vector3(m[0][0] * x.x + m[0][1] * x.y + m[0][2] * x.z, m[1][0] * x.x + m[1][1] * x.y + m[1][2] * x.z, m[2][0] * x.x + m[2][1] * x.y + m[2][2] * x.z);
  let e1 = new THREE.Vector3(1, 0.3, 0.2); for (let k = 0; k < 40; k++) e1 = mul(cov, e1).normalize();
  const tr = cov[0][0] + cov[1][1] + cov[2][2];
  const shifted = cov.map((row, r) => row.map((x, q) => (r === q ? tr : 0) - x));
  let nrm = new THREE.Vector3(0.2, 0.3, 1); for (let k = 0; k < 60; k++) { nrm = mul(shifted, nrm); nrm.sub(e1.clone().multiplyScalar(nrm.dot(e1))).normalize(); }
  nrm = e1.clone().cross(nrm).normalize();   // third axis = smallest variance = plane normal
  if (nrm.dot(c.clone().sub(pivot)) < 0) nrm.negate();   // outward, away from the HIVE body
  const up = new THREE.Vector3(0, 0, 1), yUp = up.clone().sub(nrm.clone().multiplyScalar(up.dot(nrm))).normalize();
  const xr = yUp.clone().cross(nrm).normalize();          // right, as seen facing the tags
  const { tex, W, Hh } = tagStickerTexture(ids);
  const uv = new Float32Array(n * 2);
  for (let i = 0; i < n; i++) { v.fromBufferAttribute(pos, i).sub(c); uv[2 * i] = 0.5 + v.dot(xr) / W; uv[2 * i + 1] = 0.5 + v.dot(yUp) / Hh; }
  mesh.geometry.setAttribute("uv", new THREE.BufferAttribute(uv, 2));
  mesh.material = std({ map: tex, roughness: 0.55 });
}

// ================= field from the official CAD =================
const loader = new GLTFLoader();
const hives = [null, null];
const hiveCadAngle = [0, F.hives[1].initialUpCell.includes("scoring") ? F.hives[1].stateAngle_rad : 0];   // CAD pose: red audience up, blue scoring up
const stickerIds = { "red goal april tag (audience)": [34, 35, 36, 37], "red goal april tag (scoring)": [30, 31, 32, 33],
  "blue goal april tag (audience)": [38, 39, 40, 41], "blue goal april tag (scoring)": [42, 43, 44, 45] };
function loadGroup(group, parent) {
  return new Promise((res) => loader.load(`assets/field/${group}.glb`, (g) => {
    g.scene.traverse((o) => {
      if (!o.isMesh) return;
      const nm = o.name || (o.parent && o.parent.name) || "";
      o.material = materialFor(nm, group);
      o.castShadow = group !== "tiles" && group !== "tape";
      o.receiveShadow = true;
      const lk = nm.split("/").pop().toLowerCase().replace(/^am-5888-(red|blue)[12]: /, "");
      if (stickerIds[lk]) { const h = group === "hive_red" ? 0 : 1; const pv = F.hives[h].pivot; applySticker(o, stickerIds[lk], new THREE.Vector3(pv[0], pv[1], pv[2])); }
    });
    parent.add(g.scene); res(true);
  }, undefined, () => res(false)));
}
const ballGeo = { pollen: null, nectar: null, pollen_lod1: null, nectar_lod1: null };
async function loadField() {
  $("assetState").textContent = "Loading official field CAD…";
  const groups = ["perimeter", "tape", "frame", "flowers", "trays"];
  buildTiles();
  const ok = await Promise.all(groups.map((g) => loadGroup(g, gp)));
  for (let h = 0; h < 2; h++) {
    const pv = F.hives[h].pivot, piv = new THREE.Group(), inner = new THREE.Group();
    piv.position.set(pv[0], pv[1], pv[2]); inner.position.set(-pv[0], -pv[1], -pv[2]);
    piv.add(inner); gp.add(piv); hives[h] = piv;
    ok.push(await loadGroup(h ? "hive_blue" : "hive_red", inner));
  }
  const geo = (name) => new Promise((res) => loader.load(`assets/field/${name}.glb`, (g) => { let m = null; g.scene.traverse((o) => { if (o.isMesh && !m) m = o.geometry; }); res(m); }, undefined, () => res(null)));
  ballGeo.pollen = await geo("pollen"); ballGeo.nectar = await geo("nectar");
  ballGeo.pollen_lod1 = await geo("pollen_lod1"); ballGeo.nectar_lod1 = await geo("nectar_lod1");

}
// FTC soft tiles: 6 x 6 interlocking 24 in EVA foam tiles (the CAD solids are too fine to decimate well)
function buildTiles() {
  const px = 2048, c = document.createElement("canvas"); c.width = c.height = px;
  const g = c.getContext("2d"), n = 6, s = px / n;
  let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) { const v = 92 + Math.round((rnd() - 0.5) * 8); g.fillStyle = `rgb(${v},${v + 2},${v + 5})`; g.fillRect(i * s, j * s, s, s); }
  const img = g.getImageData(0, 0, px, px);   // foam grain
  for (let k = 0; k < img.data.length; k += 4) { const d = (rnd() - 0.5) * 10; img.data[k] += d; img.data[k + 1] += d; img.data[k + 2] += d; }

    g.stroke();
  }
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
  const mat = std({ map: tex, roughness: 0.94, bumpMap: noiseTex(512, 128, 70, 5), bumpScale: 0.5 });
  mat.bumpMap.repeat.set(12, 12);
  const tiles = new THREE.Mesh(new THREE.BoxGeometry(2 * H, 2 * H, 0.0127), mat);
  tiles.position.z = -0.0064; tiles.receiveShadow = true; gp.add(tiles);
}
function fallbackField() {   // only if the CAD assets are missing
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(2 * H, 2 * H), M.tile); floor.receiveShadow = true; gp.add(floor);
}
const venueFloor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), M.floor);
venueFloor.position.z = -0.012; venueFloor.receiveShadow = true; gp.add(venueFloor);
// painted zones the CAD doesn't include as solids (tape is in the CAD; GARDENS / ALLIANCE AREAS are floor markings)
const zone = (b, color, z, op) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(b.xMax - b.xMin, b.yMax - b.yMin), std({ color, roughness: 0.9, transparent: op < 1, opacity: op })); m.position.set((b.xMin + b.xMax) / 2, (b.yMin + b.yMax) / 2, z); m.receiveShadow = true; gp.add(m); };
zone(F.allianceAreas.red, 0x2a1513, -0.008, 1); zone(F.allianceAreas.blue, 0x121b2a, -0.008, 1);

// ================= scoring elements: the official perforated balls, posed, spun and squished per ball =================
const ballMats = {
  0: phys({ color: 0xf2c418, roughness: 0.4, clearcoat: 0.25, clearcoatRoughness: 0.5, side: THREE.DoubleSide }),
  1: phys({ color: 0xd3271f, roughness: 0.4, clearcoat: 0.25, clearcoatRoughness: 0.5, side: THREE.DoubleSide }),
  2: phys({ color: 0x1d5fd6, roughness: 0.4, clearcoat: 0.25, clearcoatRoughness: 0.5, side: THREE.DoubleSide }),
};
// two levels of detail of the same official mesh: full hole detail near the camera, lighter far away
const ballIM = {}, ballIMfar = {};
function buildBalls() {
  const fallback = new THREE.SphereGeometry(1, 32, 24);
  [0, 1, 2].forEach((k) => {
    for (const far of [false, true]) {
      const g = k === 0 ? ((far && ballGeo.pollen_lod1) || ballGeo.pollen || fallback) : ((far && ballGeo.nectar_lod1) || ballGeo.nectar || fallback);

}
const _cam = new THREE.Vector3();
const _m = new THREE.Matrix4(), _q = new THREE.Quaternion(), _s = new THREE.Matrix4(), _r = new THREE.Matrix4();
function ballMatrix(fr, o, unitR) {
  // squash along the contact normal, bulge sideways (volume ~ conserved): S = I + a n n^T + b (I - n n^T)
  const r = fr[o + 4], sq = fr[o + 10], nx = fr[o + 11], ny = fr[o + 12], nz = fr[o + 13];
  const a = -sq / r, b = 0.5 * sq / r;

         (a - b) * nz * nx, (a - b) * nz * ny, 1 + b + (a - b) * nz * nz, 0, 0, 0, 0, 1);
  _q.set(fr[o + 7], fr[o + 8], fr[o + 9], fr[o + 6]);

// ================= robots: open frames so the balls inside stay visible =================
const robots = [];
function signTexture(label, red) {
  const c = document.createElement("canvas"); c.width = 512; c.height = 160; const g = c.getContext("2d");

  add(new THREE.BoxGeometry(0.12, 0.08, 0.06), std({ color: 0x2b2d30, roughness: 0.7 }), -L * 0.25, -W * 0.15, 0.11);    // battery

function ensureRobots(n) {

}

// ================= per-frame pose update from the simulation =================
const RS = 17, ES = 14, CS = 5;
function draw(fr) {
  const nR = fr[4], nE = fr[5], nC = fr[6];
  let o = 7;
  ensureRobots(nR);
  for (let i = 0; i < nR; i++, o += RS) {
    const r = robots[i];
    r.g.position.set(fr[o], fr[o + 1], 0); r.g.rotation.set(0, 0, fr[o + 2]);
    if (fr[o + 5]) r.g.rotation.x = 1.2;
    if (r.roller) r.roller.rotation.y = -fr[o + 9];
    if (r.fly) r.fly.rotation.y = fr[o + 10];
    if (r.hood) r.hood.rotation.y = -(fr[o + 11] - 0.9) * 0.5;
    r.wheels.forEach((w) => { const k = (w.x > 0 ? 0 : 2) + (w.y > 0 ? 0 : 1); w.spin.rotation.y = fr[o + 12 + k]; });
  }
  const cnt = { 0: 0, 1: 0, 2: 0 }, cntFar = { 0: 0, 1: 0, 2: 0 };
  _cam.set(camera.position.x, -camera.position.z, camera.position.y);   // camera in the field frame
  const lodDist2 = state.gfx === "ultra" ? 16 : state.gfx === "balanced" ? 2.25 : 6.25;
  for (let i = 0; i < nE; i++, o += ES) {
    if (!fr[o + 5]) continue;
    const k = fr[o + 3];
    const dx = fr[o] - _cam.x, dy = fr[o + 1] - _cam.y, dzz = fr[o + 2] - _cam.z;
    const far = dx * dx + dy * dy + dzz * dzz > lodDist2;
    const im = far ? ballIMfar[k] : ballIM[k]; if (!im) continue;
    im.setMatrixAt(far ? cntFar[k]++ : cnt[k]++, ballMatrix(fr, o, im.userData.unitR));
  }
  [0, 1, 2].forEach((k) => {
    if (ballIM[k]) { ballIM[k].count = cnt[k]; ballIM[k].instanceMatrix.needsUpdate = true; }
    if (ballIMfar[k]) { ballIMfar[k].count = cntFar[k]; ballIMfar[k].instanceMatrix.needsUpdate = true; }
  });
  o += nC * CS;
  for (let h = 0; h < 2; h++) if (hives[h]) hives[h].rotation.x = fr[o + h] - hiveCadAngle[h];
}

// ================= driver camera: a person in the alliance area; never follows the robot =================
const look = { yaw: 0, pitch: -0.32, baseYaw: 0, drag: null };
function placeDriver() {
  const A = F.allianceAreas[state.alliance], s = +$("stand").value;
  const y = A.yMin + (A.yMax - A.yMin) * s;
  const x = state.alliance === "red" ? -H - 0.55 : H + 0.55;
  camera.position.copy(T(x, y, +$("eye").value));
  look.baseYaw = state.alliance === "red" ? -Math.PI / 2 : Math.PI / 2; look.yaw = look.baseYaw; look.pitch = -0.32;
  camera.fov = +$("fov").value; camera.updateProjectionMatrix();
}
function applyLook() {
  if (state.overhead) { camera.position.set(0, 6.4, 0.01); camera.lookAt(0, 0, 0); return; }
  look.yaw = Math.max(look.baseYaw - 1.75, Math.min(look.baseYaw + 1.75, look.yaw));
  look.pitch = Math.max(-1.2, Math.min(0.55, look.pitch));

}
canvas.addEventListener("pointerdown", (e) => { look.drag = [e.clientX, e.clientY]; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener("pointermove", (e) => { if (!look.drag) return; look.yaw -= (e.clientX - look.drag[0]) * 0.004; look.pitch -= (e.clientY - look.drag[1]) * 0.004; look.drag = [e.clientX, e.clientY]; });
canvas.addEventListener("pointerup", () => { look.drag = null; });
$("viewBtn").onclick = () => { state.overhead = !state.overhead; $("viewBtn").textContent = state.overhead ? "Driver view" : "Overhead view"; if (!state.overhead) placeDriver(); };
["stand", "eye", "fov"].forEach((id) => $(id).addEventListener("input", () => { if (!state.running) placeDriver(); }));

// ================= input: physical gamepad (FTC semantics) with keyboard fallback =================
const keys = new Set();
addEventListener("keydown", (e) => { if (state.running && !/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { keys.add(e.code); if (e.code.startsWith("Arrow") || e.code === "Space") e.preventDefault(); } });
addEventListener("keyup", (e) => keys.delete(e.code));
const DZ = 0.06, dz = (v) => (Math.abs(v) < DZ ? 0 : (v - Math.sign(v) * DZ) / (1 - DZ));

}

// ================= match loop =================
$("setupForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  state.sim = await GamePlanWasm.create(wasmBytes, (l) => console.log(l));   // fresh world per match
  robots.forEach((r) => gp.remove(r.g)); robots.length = 0;
  const robot = $("robotJson").textContent;
  state.sim.init($("seasonJson").textContent, $("compsJson").textContent, robot, robot, {
    seed: +$("seed").value || 1, alliance: state.alliance, mode: state.mode, difficulty: +$("diff").value,
    opponentPersonality: $("opp").value, partnerPersonality: "coordinated", partnerInstruction: $("instr").value, uncertainty: "realistic" });
  state.elec = []; state.running = true; state.overhead = false;
  placeDriver();
  ["hud", "conn", "keys", "viewBtn"].forEach((id) => { $(id).hidden = false; });
  $("setup").hidden = true; $("toast").hidden = true; $("report").hidden = true;
  canvas.focus();
});
let last = performance.now(), elecT = -1, lastSize = "";
function frame(now) {
  if (window.__gpPause) { last = now; requestAnimationFrame(frame); return; }   // test hook: frozen for screenshots
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (state.running && state.sim) {
    state.sim.setPad(readPad(dt));
    const done = state.sim.step(dt);
    draw(state.sim.frame());
    const h = state.sim.hud();
    $("timer").textContent = h.timer; $("phase").textContent = h.phase.replace("_", " ") + (state.mode === "practice" ? " · practice" : "");
    $("sRed").textContent = h.red; $("sBlue").textContent = h.blue;
    $("connText").textContent = h.connection; $("conn").classList.toggle("bad", h.connection !== "Connected");
    const el = state.sim.elec();

    if (done) finish();
  }
  applyLook();
  resize();
  composer.render();
  requestAnimationFrame(frame);
}
function resize() {
  const w = canvas.clientWidth, h = canvas.clientHeight, key2 = w + "x" + h + "@" + renderer.getPixelRatio();
  if (key2 === lastSize) return;
  lastSize = key2;
  renderer.setSize(w, h, false); composer.setPixelRatio(renderer.getPixelRatio()); composer.setSize(w, h);
  camera.aspect = w / Math.max(1, h); camera.updateProjectionMatrix();
}
function finish() { state.running = false; $("keys").hidden = true; $("toast").hidden = false; }
$("dismiss").onclick = () => { $("toast").hidden = true; $("setup").hidden = false; ["hud", "conn", "viewBtn"].forEach((id) => { $(id).hidden = true; }); };
$("openReport").onclick = () => { $("toast").hidden = true; renderReport(); $("report").hidden = false; };

// ================= post-match report =================
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function chart(cv, series, unit) {
  const dpr = Math.min(2, devicePixelRatio || 1), W = cv.clientWidth * dpr, Hh = cv.clientHeight * dpr;
  cv.width = W; cv.height = Hh; const c = cv.getContext("2d");
  const pad = { l: 44 * dpr, r: 10 * dpr, t: 12 * dpr, b: 22 * dpr };
  const xs = state.elec.map((r) => r[0]);
  let lo = Infinity, hi = -Infinity; series.forEach((s) => state.elec.forEach((r) => { lo = Math.min(lo, r[s.i]); hi = Math.max(hi, r[s.i]); }));
  if (!isFinite(lo)) return; if (hi - lo < 1e-6) { hi += 1; lo -= 1; } const m = (hi - lo) * 0.08; lo -= m; hi += m;
  const X = (x) => pad.l + (x - xs[0]) / Math.max(1e-6, xs[xs.length - 1] - xs[0]) * (W - pad.l - pad.r);
  const Y = (y) => pad.t + (1 - (y - lo) / (hi - lo)) * (Hh - pad.t - pad.b);
  c.font = `${11 * dpr}px IBM Plex Mono, monospace`; c.fillStyle = "#8e9aa5"; c.strokeStyle = "#2b343d"; c.lineWidth = dpr;
  for (let k = 0; k <= 4; k++) { const v = lo + (hi - lo) * k / 4, y = Y(v); c.beginPath(); c.moveTo(pad.l, y); c.lineTo(W - pad.r, y); c.stroke(); c.fillText(v.toFixed(1), 4 * dpr, y + 4 * dpr); }
  c.fillText(unit, 4 * dpr, 10 * dpr);
  [38, 98, 138].forEach((t) => { const x = X(t); if (x > pad.l && x < W - pad.r) { c.setLineDash([3 * dpr, 4 * dpr]); c.beginPath(); c.moveTo(x, pad.t); c.lineTo(x, Hh - pad.b); c.stroke(); c.setLineDash([]); } });
  series.forEach((s) => { c.strokeStyle = s.color; c.lineWidth = 1.6 * dpr; c.beginPath(); state.elec.forEach((r, i) => { const x = X(r[0]), y = Y(r[s.i]); i ? c.lineTo(x, y) : c.moveTo(x, y); }); c.stroke(); });
}
function renderReport() {

  const rows = (a) => Object.entries(r[a].breakdown).map(([k, v]) => `<tr><td>${esc(k.replace(/_/g, " "))}</td><td>${v}</td></tr>`).join("") + `<tr><td>Foul credit</td><td>${r[a].foulCredit}</td></tr>`;
  const viol = r.violations.length ? r.violations.map((v) => `<tr><td>${v.matchTime.toFixed(1)} s</td><td>${esc(v.rule)} <span class="tag">${v.judgment ? "judgment" : "objective"}</span></td><td>${esc(v.offender)}</td><td>${esc(v.penalty)}</td><td>${esc(v.rationale)}</td></tr>`).join("") : `<tr><td colspan="5">No violations assessed.</td></tr>`;
  const motors = u.motors.map((m) => `<tr><td>${esc(m.name)}</td><td>${m.energy_J.toFixed(0)}</td><td>${m.peak_A.toFixed(1)}</td><td>${m.winding_C.toFixed(0)}</td></tr>`).join("");
  const pd = r.partnerDirectives || { matched: [], notUnderstood: [] };
  $("reportCard").innerHTML = `
    <div class="row"><h1>Match report</h1><span class="tag">${esc(season.manual.teamUpdate)} · ${esc(season.rulesEngineVersion)} · seed ${+$("seed").value}${state.mode === "practice" ? " · PRACTICE" : ""}</span></div>
    <div class="bigscore"><span class="r">${r.red.total}</span><span class="vs">vs</span><span class="b">${r.blue.total}</span><span class="tag">RP red ${r.red.rp} · blue ${r.blue.rp}</span></div>
    <div class="grid"><div class="tbl-wrap"><table><tr><th>Red</th><th>pts</th></tr>${rows("red")}</table></div><div class="tbl-wrap"><table><tr><th>Blue</th><th>pts</th></tr>${rows("blue")}</table></div></div>
    <h2>Violations</h2><div class="tbl-wrap"><table><tr><th>Time</th><th>Rule</th><th>Alliance</th><th>Penalty</th><th>Basis</th></tr>${viol}</table></div>
    <h2>Your robot's electrical system</h2>
    <p class="lede">Collected during the match and shown only now. Min hub bus ${u.minHubBusV.toFixed(2)} V, peak battery current ${u.peakBatteryA.toFixed(1)} A, ${(u.energy_J / 1000).toFixed(2)} kJ used, final charge ${(u.finalSoc * 100).toFixed(1)} %, ${r.distance_m.toFixed(1)} m driven. Values are calculated by the coupled model; component data carries provenance in the GamePlan repository.</p>
    <canvas class="chart" id="cV" aria-label="Battery terminal and hub bus voltage over the match"></canvas>
    <canvas class="chart" id="cI" aria-label="Battery current over the match"></canvas>
    <div class="tbl-wrap"><table><tr><th>Motor</th><th>Energy J</th><th>Peak A</th><th>Winding °C</th></tr>${motors}</table></div>
    <h2>Alliance partner</h2>
    <p class="lede">${pd.matched.length ? "Followed: " + pd.matched.map(esc).join("; ") : "Played its default strategy."}${pd.notUnderstood && pd.notUnderstood.length ? " Not understood: " + pd.notUnderstood.map(esc).join("; ") : ""}</p>
    <div class="row"><span class="parsed">Dashed lines: TELEOP start, FLOWER unlock (1:00), final 20 s.</span><button type="button" id="again">Set up another match</button></div>`;
  chart($("cV"), [{ i: 1, color: "#f2c230" }, { i: 3, color: "#4fbf7a" }], "V  battery · hub");
  chart($("cI"), [{ i: 2, color: "#e0453a" }], "A  battery");
  $("again").onclick = () => { $("report").hidden = true; $("setup").hidden = false; ["hud", "conn", "viewBtn"].forEach((id) => { $(id).hidden = true; }); };
}

applyQuality(state.gfx);
placeDriver();
loadField();
requestAnimationFrame(frame);
// test hook for automated screenshots (no effect on play)
window.__gp = { THREE, scene, camera, state, draw, placeDriver, look, robots,
  renderFrame: (noLook) => { if (!noLook) applyLook(); resize(); composer.render(); },
  advance: (s) => { for (let t = 0; t < s; t += 0.05) { state.sim.setPad(readPad(0.05)); state.sim.step(0.05); } draw(state.sim.frame()); } };
